<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WiFi Access</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
    background: #ffffff;
    color: #1f2937;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
}
.card {
    width: 100%;
    max-width: 380px;
    text-align: center;
}
.card h2 {
    font-weight: 600;
    font-size: 26px;
    margin-bottom: 10px;
}
.sub-text {
    color: #6b7280;
    font-size: 15px;
    margin-bottom: 36px;
}
.form-group {
    text-align: left;
    margin-bottom: 22px;
}
.form-group label {
    display: block;
    font-size: 14px;
    color: #374151;
    margin-bottom: 8px;
}
.form-group input {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
    transition: border 0.2s;
    letter-spacing: 1px;
}
.form-group input:focus {
    border-color: #2563eb;
}
.submit-btn {
    width: 100%;
    padding: 14px;
    background-color: #2563eb;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}
.submit-btn:hover {
    background-color: #1d4ed8;
}
.policy-tip {
    margin-top: 28px;
    font-size: 12px;
    color: #9ca3af;
    line-height: 1.5;
}
.policy-tip a {
    color: #2563eb;
    text-decoration: none;
}
.policy-tip a:hover {
    text-decoration: underline;
}
</style>
</head>
<body>
<div class="card">
    <h2>WiFi Access Authentication</h2>
    <p class="sub-text">Please enter your voucher code to get online</p>
    <form method="post">
        <div class="form-group">
            <label>Voucher Code</label>
            <input type="text" name="code" placeholder="Enter your code" autocomplete="off" required>
        </div>
        <button class="submit-btn" type="submit">Connect</button>
    </form>
    <p class="policy-tip">By using this network, you agree to the <a href="terms.html">Network Usage Policy</a>.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
<script>
function urlcat(obj) {
    var serach = window.location.search;
    var href = serach.replace('?','&');
    obj.each(function(){
        var url = $(this).attr("href") + href;
        $(this).attr("href",url);
    });
}
$(function(){
    urlcat($("a"));
    urlcat($("form"));
});
</script>
</body>
</html>
